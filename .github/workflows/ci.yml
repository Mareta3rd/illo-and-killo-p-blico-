name: Arsa & Pisha cloud work gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_qwen:
        description: "Run one CPU Qwen 4B experiment (~2.6 GB download); the result artifact is public for 7 days."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: Full Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Run complete suite
        run: python -m pytest -q
        env:
          PYTHONPATH: .

  qwen-collaboration:
    name: Optional bounded Qwen collaboration run
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_qwen) || (github.event_name == 'push' && github.ref == 'refs/heads/experiment/qwen-cpu-once-20261013' && github.event.created) }}
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_REVISION: ec85e0c4ae5c1d1e467dd98a0af99983358b4680
      MODEL_FILE: Qwen3-4B-Instruct-2507-q4_k_m.gguf
      LLAMA_ARCHIVE: llama-b11583-bin-ubuntu-x64.tar.gz
      LLAMA_SHA256: a4a681375770db521d15c66bd28339617b833ffc3bcc0a01ff93a883bac80438
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Download and verify pinned CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/llama" "$RUNNER_TEMP/output"
          archive="$RUNNER_TEMP/$LLAMA_ARCHIVE"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/ggml-org/llama.cpp/releases/download/b11583/$LLAMA_ARCHIVE"
          printf '%s  %s\n' "$LLAMA_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP/llama"
          find "$RUNNER_TEMP/llama" -maxdepth 5 -type f -name llama-server -print -quit \
            > "$RUNNER_TEMP/output/server_path.txt"
          test -s "$RUNNER_TEMP/output/server_path.txt"
          chmod +x "$(cat "$RUNNER_TEMP/output/server_path.txt")"

      - name: Download pinned Qwen model
        shell: bash
        run: |
          set -euo pipefail
          model="$RUNNER_TEMP/$MODEL_FILE"
          curl --fail --location --retry 3 --output "$model" \
            "https://huggingface.co/Mungert/Qwen3-4B-Instruct-2507-GGUF/resolve/$MODEL_REVISION/$MODEL_FILE?download=true"
          test "$(stat -c '%s' "$model")" -eq 2572721440
          sha256sum "$model" > "$RUNNER_TEMP/output/model.sha256"

      - name: Run one local-only collaboration pass
        shell: bash
        env:
          LOCAL_QWEN_API_KEY: local
        run: |
          set -euo pipefail
          server="$(cat "$RUNNER_TEMP/output/server_path.txt")"
          model="$RUNNER_TEMP/$MODEL_FILE"
          server_dir="$(dirname "$server")"
          export LD_LIBRARY_PATH="$server_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$server" \
            --model "$model" \
            --alias qwen3-4b-cloud \
            --host 127.0.0.1 \
            --port 8080 \
            --api-key local \
            --n-gpu-layers 0 \
            --ctx-size 8192 \
            --threads 4 \
            --threads-batch 4 \
            --batch-size 128 \
            --ubatch-size 64 \
            --parallel 1 \
            --n-predict 2048 \
            > "$RUNNER_TEMP/output/server.stdout.log" \
            2> "$RUNNER_TEMP/output/server.stderr.log" &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 90); do
            if curl --fail --silent --show-error \
              --header 'Authorization: Bearer local' \
              http://127.0.0.1:8080/health > /dev/null 2>&1; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/output/server.stderr.log"
            exit 1
          fi

          set +e
          PYTHONPATH=. python scripts/run_local_collaboration.py \
            --run-id "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --model qwen3-4b-cloud \
            --base-url http://127.0.0.1:8080/v1 \
            --artifact-path "$RUNNER_TEMP/output/collaboration-record.json" \
            > "$RUNNER_TEMP/output/runner.log" 2>&1
          run_status=$?
          set -e
          cat "$RUNNER_TEMP/output/runner.log"
          printf '%s\n' "$run_status" > "$RUNNER_TEMP/output/runner-exit-code.txt"
          exit "$run_status"

      - name: Preserve short-lived experiment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arsa-pisha-qwen-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/output/
          if-no-files-found: warn
          retention-days: 7
